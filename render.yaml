services:
  - type: web
    name: rubik-speedcube-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./speedcube.db
      - key: PYTHON_VERSION
        value: 3.13.0
